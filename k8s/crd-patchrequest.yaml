---
# PatchRequest CRD — A human-approved remediation request generated by the SRE controller.
# Lifecycle: Pending → Approved → Applied | Rejected
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: patchrequests.sre.yourdomain.io
spec:
  group: sre.yourdomain.io
  names:
    kind: PatchRequest
    listKind: PatchRequestList
    plural: patchrequests
    singular: patchrequest
    shortNames:
      - pr
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Deployment
          type: string
          jsonPath: .spec.targetDeployment
        - name: Error
          type: string
          jsonPath: .spec.errorState
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: State
          type: string
          jsonPath: .status.approvalState
        - name: Seen
          type: integer
          jsonPath: .spec.seenCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["incidentId", "targetDeployment", "targetNamespace", "errorState"]
              properties:
                incidentId:
                  type: string
                  description: "INC-YYYY-MMDD-XXXX identifier"
                targetDeployment:
                  type: string
                targetNamespace:
                  type: string
                errorState:
                  type: string
                  enum:
                    - CrashLoopBackOff
                    - OOMKilled
                    - ImagePullBackOff
                    - CreateContainerConfigError
                    - ContainerCrashed
                rootCause:
                  type: string
                  maxLength: 500
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                confidence:
                  type: string
                  enum: [low, medium, high]
                seenCount:
                  type: integer
                  minimum: 1
                llmSummary:
                  type: string
                  maxLength: 500
                humanNote:
                  type: string
                autoRestartSafe:
                  type: boolean
                likelyRecurring:
                  type: boolean
                proposedPatch:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                llmDiagnosis:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                approvalState:
                  type: string
                  enum: [Pending, Approved, Applied, Rejected]
                approvedBy:
                  type: string
                approvedAt:
                  type: string
                appliedAt:
                  type: string
                rejectionReason:
                  type: string
