---
# ── ServiceAccounts ────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-observer-sa
  namespace: monitoring
  labels:
    app: sre-controller
---
# sre-observer-sa: Full read access + CRD write (PatchRequest, IncidentRecord)
# Intentionally NO write access to Deployments/Secrets — the executor does that.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-observer-role
rules:
  # Core reads needed by the controller
  - apiGroups: [""]
    resources: [pods, pods/log, pods/status, events, namespaces, configmaps]
    verbs: [get, list, watch, patch, update]   # patch needed by Kopf to write status annotations
  # Node visibility — needed to detect NodeNotReady/DiskPressure/etc. and to
  # count pods-on-a-node for blast-radius reporting. `patch` is required even
  # though most of this SA's node usage is read-only — kopf writes its own
  # bookkeeping annotations onto every object it watches (same reason the
  # `pods` rule above needs it).
  #
  # IMPORTANT — discovered while building the Node domain, not designed this
  # way on purpose: controller-deployment.yaml runs the ENTIRE controller
  # (including the code that's supposed to be the "least-privilege executor")
  # under this single ServiceAccount. sre-executor-sa/sre-executor-role below
  # are defined but never bound to any running pod — the "separate
  # least-privilege executor" security model described in this file's
  # comments and in the README is aspirational, not actually enforced at
  # runtime today. So the node/eviction verbs a real executor would need
  # (patching spec.unschedulable, dry-run pod eviction) are granted HERE,
  # on the observer role, because this is the identity actually in use.
  # Deliberately not splitting this into two real identities: the actual
  # safety boundary in this system is that every change requires a human to
  # approve a PatchRequest first, not which internal identity ran the code.
  # See docs/decisions/phase2_rca.md for the full reasoning.
  - apiGroups: [""]
    resources: [nodes, nodes/status]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  # Read and patch deployments to trace pod → deployment ownership and apply approved patches
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, deployments/rollback]
    verbs: [get, list, watch, patch, update, create]
  # Full CRD access for PatchRequest and IncidentRecord
  - apiGroups: [sre.yourdomain.io]
    resources: [patchrequests, patchrequests/status, incidentrecords]
    verbs: [get, list, watch, create, update, patch, delete]
  # Kopf's internal lease locking (leader election)
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  # Kopf needs events to record its own activity
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-observer-binding
subjects:
  - kind: ServiceAccount
    name: sre-observer-sa
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: sre-observer-role
  apiGroup: rbac.authorization.k8s.io
---
# ── Executor ServiceAccount (separate principle — least privilege) ─────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sre-executor-sa
  namespace: monitoring
  labels:
    app: sre-controller
---
# sre-executor-sa: ONLY allowed to patch Deployments/StatefulSets/ConfigMaps,
# plus (as of the Node domain) cordon nodes and dry-run pod evictions.
# Explicitly cannot touch Secrets, RBAC, or PersistentVolumes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-executor-role
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, patch, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, patch, update]
  - apiGroups: [sre.yourdomain.io]
    resources: [patchrequests, patchrequests/status]
    verbs: [get, patch, update]
  # Cordon (spec.unschedulable) only — no delete/evict rights on the Node
  # object itself.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
  # Needed even for a dry-run eviction call — the API server checks RBAC
  # before it checks the dry-run flag. drain_node's execute() refuses to run
  # for real regardless (see controller/actions.py); this permission only
  # ever backs a dry-run today.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-executor-binding
subjects:
  - kind: ServiceAccount
    name: sre-executor-sa
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: sre-executor-role
  apiGroup: rbac.authorization.k8s.io
