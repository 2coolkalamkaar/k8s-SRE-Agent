---
# IncidentRecord CRD — Cluster-scoped lightweight incident log.
# The controller writes one record per unique incident for kubectl CLI access.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: incidentrecords.sre.yourdomain.io
spec:
  group: sre.yourdomain.io
  names:
    kind: IncidentRecord
    listKind: IncidentRecordList
    plural: incidentrecords
    singular: incidentrecord
    shortNames:
      - inc
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Deployment
          type: string
          jsonPath: .spec.targetDeployment
        - name: Namespace
          type: string
          jsonPath: .spec.targetNamespace
        - name: Error
          type: string
          jsonPath: .spec.errorState
        - name: State
          type: string
          jsonPath: .spec.state
        - name: Seen
          type: integer
          jsonPath: .spec.recurrenceCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: ["spec"]
          properties:
            spec:
              type: object
              required: ["incidentId", "errorState", "targetDeployment", "targetNamespace"]
              properties:
                incidentId:
                  type: string
                errorState:
                  type: string
                errorFingerprint:
                  type: string
                targetDeployment:
                  type: string
                targetNamespace:
                  type: string
                rootCause:
                  type: string
                state:
                  type: string
                  enum: [Open, Investigating, Resolved, Closed]
                recurrenceCount:
                  type: integer
                  minimum: 1
                tags:
                  type: array
                  items:
                    type: string
