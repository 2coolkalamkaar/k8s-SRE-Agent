# ── Grafana Datasources Provisioning ─────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.observability.svc.cluster.local:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: "15s"

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: ""
          serviceMap:
            datasourceUid: "prometheus"
          nodeGraph:
            enabled: true
          traceQuery:
            timeShiftEnabled: true
            spanStartTimeShift: "1h"
            spanEndTimeShift: "-1h"
          spanBar:
            type: "Tag"
            tag: "http.path"

---
# ── Grafana Dashboard Provisioning ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'sre-agent'
        orgId: 1
        folder: 'SRE Agent'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
# ── SRE Agent Overview Dashboard ─────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sre-overview
  namespace: observability
data:
  sre-overview.json: |
    {
      "id": null,
      "title": "SRE Agent — Overview",
      "tags": ["sre", "k8s", "ai"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Total Incidents Detected",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(sre_agent_incidents_total) or vector(0)", "legendFormat": "Incidents"}]
        },
        {
          "id": 2,
          "title": "Active PatchRequests",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(sre_agent_patchrequests_total) or vector(0)", "legendFormat": "PatchRequests"}]
        },
        {
          "id": 3,
          "title": "LLM Calls Saved by Dedup",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(sre_agent_dedup_hits_total) or vector(0)", "legendFormat": "Dedup Hits"}]
        },
        {
          "id": 4,
          "title": "LLM Errors",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(sre_agent_llm_errors_total) or vector(0)", "legendFormat": "LLM Errors"}]
        },
        {
          "id": 5,
          "title": "Incidents Over Time",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "increase(sre_agent_incidents_total[5m])", "legendFormat": "{{error_state}} — {{deployment}}"}
          ],
          "fieldConfig": {"defaults": {"custom": {"lineWidth": 2, "fillOpacity": 20}}}
        },
        {
          "id": 6,
          "title": "Deduplication Savings by Layer",
          "type": "bargauge",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "options": {"orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sre_agent_dedup_hits_total", "legendFormat": "Layer {{layer}}"}
          ]
        },
        {
          "id": 7,
          "title": "Incidents by Error State",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (error_state) (sre_agent_incidents_total)", "legendFormat": "{{error_state}}"}
          ]
        },
        {
          "id": 8,
          "title": "Incidents by Namespace",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (namespace) (sre_agent_incidents_total)", "legendFormat": "{{namespace}}"}
          ]
        }
      ]
    }

---
# ── LLM Performance Dashboard ─────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-llm-perf
  namespace: observability
data:
  llm-performance.json: |
    {
      "id": null,
      "title": "SRE Agent — LLM Performance",
      "tags": ["sre", "llm", "gemini"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Gemini p50 Latency",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"},
          "fieldConfig": {"defaults": {"unit": "s"}},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.5, rate(sre_agent_llm_duration_seconds_bucket[5m]))", "legendFormat": "p50"}]
        },
        {
          "id": 2,
          "title": "Gemini p95 Latency",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value"},
          "fieldConfig": {"defaults": {"unit": "s", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 10}, {"color": "red", "value": 30}]}}},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, rate(sre_agent_llm_duration_seconds_bucket[5m]))", "legendFormat": "p95"}]
        },
        {
          "id": 3,
          "title": "Total LLM Calls",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(sre_agent_llm_duration_seconds_count) or vector(0)", "legendFormat": "Total Calls"}]
        },
        {
          "id": 4,
          "title": "LLM Error Rate",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "options": {"colorMode": "background"},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(sre_agent_llm_errors_total) or vector(0)", "legendFormat": "Errors"}]
        },
        {
          "id": 5,
          "title": "LLM Call Latency Over Time",
          "type": "timeseries",
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 4},
          "fieldConfig": {"defaults": {"unit": "s", "custom": {"lineWidth": 2, "fillOpacity": 10}}},
          "targets": [
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.50, rate(sre_agent_llm_duration_seconds_bucket[5m]))", "legendFormat": "p50"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, rate(sre_agent_llm_duration_seconds_bucket[5m]))", "legendFormat": "p95"},
            {"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, rate(sre_agent_llm_duration_seconds_bucket[5m]))", "legendFormat": "p99"}
          ]
        },
        {
          "id": 6,
          "title": "LLM Calls by Provider",
          "type": "piechart",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 14},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (provider) (sre_agent_llm_duration_seconds_count)", "legendFormat": "{{provider}}"}]
        },
        {
          "id": 7,
          "title": "LLM Latency Heatmap",
          "type": "heatmap",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 14},
          "targets": [{"datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(sre_agent_llm_duration_seconds_bucket[5m])) by (le)", "legendFormat": "{{le}}", "format": "heatmap"}]
        }
      ]
    }

---
# ── Grafana Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "sreagent123"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: "traceqlEditor"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-sre-overview
              mountPath: /var/lib/grafana/dashboards/sre-overview.json
              subPath: sre-overview.json
            - name: dashboard-llm-perf
              mountPath: /var/lib/grafana/dashboards/llm-performance.json
              subPath: llm-performance.json
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-sre-overview
          configMap:
            name: grafana-dashboard-sre-overview
        - name: dashboard-llm-perf
          configMap:
            name: grafana-dashboard-llm-perf

---
# ── Grafana Service (NodePort) ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30300

---
# ── SRE Agent SLO Dashboard ───────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-slo-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  sre-agent-slos.json: |
    {
      "title": "SRE Agent — SLO Overview",
      "uid": "sre-agent-slos",
      "tags": ["sre", "slo", "platform"],
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "MTTR — p95 / p50 (Mean Time to Resolution)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s", "color": { "mode": "palette-classic" } }
          },
          "targets": [
            {
              "expr": "sre_agent_mttr_p95_1h",
              "legendFormat": "MTTR p95",
              "datasource": { "uid": "prometheus" }
            },
            {
              "expr": "sre_agent_mttr_p50_1h",
              "legendFormat": "MTTR p50 (median)",
              "datasource": { "uid": "prometheus" }
            }
          ]
        },
        {
          "id": 2,
          "title": "MTTD — Avg Detection Time",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 120 },
                  { "color": "red", "value": 300 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sre_agent_mttd_avg_5m",
              "legendFormat": "MTTD avg",
              "datasource": { "uid": "prometheus" }
            }
          ]
        },
        {
          "id": 3,
          "title": "Auto-Resolve Rate (last 1h)",
          "type": "gauge",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0, "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "green", "value": 0.8 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sre_agent_auto_resolve_rate_1h",
              "legendFormat": "Auto-resolve rate",
              "datasource": { "uid": "prometheus" }
            }
          ]
        },
        {
          "id": 4,
          "title": "Incidents Detected — by Severity",
          "type": "barchart",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "targets": [
            {
              "expr": "increase(sre_agent_incidents_total[1h])",
              "legendFormat": "{{severity}} / {{error_state}}",
              "datasource": { "uid": "prometheus" }
            }
          ]
        },
        {
          "id": 5,
          "title": "LLM Call Latency (p95)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s" }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(sre_agent_llm_duration_seconds_bucket[5m]))",
              "legendFormat": "LLM latency p95",
              "datasource": { "uid": "prometheus" }
            }
          ]
        },
        {
          "id": 6,
          "title": "Dedup Hits by Layer (noise suppressed)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "fieldConfig": {
            "defaults": { "unit": "short" }
          },
          "targets": [
            {
              "expr": "rate(sre_agent_dedup_hits_total[5m])",
              "legendFormat": "{{layer}}",
              "datasource": { "uid": "prometheus" }
            }
          ]
        }
      ]
    }
