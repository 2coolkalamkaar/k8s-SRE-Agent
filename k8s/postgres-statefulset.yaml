apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: monitoring
type: Opaque
stringData:
  username: sreagent
  password: sreagentpassword123
  database: sredb
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: monitoring
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS incidents (
        id                SERIAL PRIMARY KEY,
        incident_id       VARCHAR(20) UNIQUE NOT NULL,
        state             VARCHAR(20) NOT NULL DEFAULT 'Open',
        error_state       VARCHAR(50) NOT NULL,
        error_fingerprint VARCHAR(64) NOT NULL,
        target_deployment VARCHAR(100) NOT NULL,
        target_namespace  VARCHAR(100) NOT NULL,
        root_cause        TEXT,
        llm_diagnosis     JSONB,
        patch_applied     JSONB,
        approved_by       VARCHAR(100),
        resolution_notes  TEXT,
        rca_summary       TEXT,
        worked            BOOLEAN,
        mttd_seconds      INTEGER,
        mttr_seconds      INTEGER,
        recurrence_count  INTEGER DEFAULT 1,
        tags              TEXT[],
        opened_at         TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        investigating_at  TIMESTAMPTZ,
        resolved_at       TIMESTAMPTZ,
        closed_at         TIMESTAMPTZ,
        created_at        TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at        TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS state_transitions (
        id              SERIAL PRIMARY KEY,
        incident_id     VARCHAR(20) NOT NULL REFERENCES incidents(incident_id) ON DELETE CASCADE,
        from_state      VARCHAR(20),
        to_state        VARCHAR(20) NOT NULL,
        triggered_by    VARCHAR(100),
        reason          TEXT,
        metadata        JSONB,
        transitioned_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS patch_requests (
        id              SERIAL PRIMARY KEY,
        pr_name         VARCHAR(100) UNIQUE NOT NULL,
        incident_id     VARCHAR(20) REFERENCES incidents(incident_id) ON DELETE CASCADE,
        proposed_patch  JSONB NOT NULL,
        approval_state  VARCHAR(20) DEFAULT 'Pending',
        approved_by     VARCHAR(100),
        applied_at      TIMESTAMPTZ,
        created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS incident_metrics (
        id              SERIAL PRIMARY KEY,
        incident_id     VARCHAR(20) REFERENCES incidents(incident_id) ON DELETE CASCADE,
        metric_name     VARCHAR(50) NOT NULL,
        metric_value    FLOAT NOT NULL,
        recorded_at     TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_incidents_state ON incidents(state);
    CREATE INDEX IF NOT EXISTS idx_incidents_opened_at ON incidents(opened_at);
    CREATE INDEX IF NOT EXISTS idx_incidents_deployment ON incidents(target_deployment);
    CREATE INDEX IF NOT EXISTS idx_incidents_error ON incidents(error_state);
    CREATE INDEX IF NOT EXISTS idx_incidents_fingerprint ON incidents(error_fingerprint);
    CREATE INDEX IF NOT EXISTS idx_transitions_incident ON state_transitions(incident_id);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: monitoring
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: monitoring
spec:
  serviceName: postgres-svc
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      priorityClassName: sre-monitoring
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-script
          configMap:
            name: postgres-init-script
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
