apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: patchrequests.sre.yourdomain.io
spec:
  group: sre.yourdomain.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                incidentId:       { type: string }
                targetPod:        { type: string }
                targetDeployment: { type: string }
                targetNamespace:  { type: string }
                errorState:       { type: string }
                rootCause:        { type: string }
                severity:         { type: string, enum: [low, medium, high, critical] }
                confidence:       { type: string, enum: [low, medium, high] }
                seenCount:        { type: integer }
                llmSummary:       { type: string }
                humanNote:        { type: string }
                autoRestartSafe:  { type: boolean }
                likelyRecurring:   { type: boolean }
                proposedPatch:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                llmDiagnosis:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                approvalState:
                  type: string
                  enum: [Pending, Approved, Rejected, Applied, Verifying, Closed, Failed, RolledBack]
                  default: Pending
                approvedBy:           { type: string }
                appliedAt:            { type: string }
                observationStartTime: { type: string }
                workedOutcome:        { type: boolean }
                mttrSeconds:          { type: integer }
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Deployment
          type: string
          jsonPath: .spec.targetDeployment
        - name: Error
          type: string
          jsonPath: .spec.errorState
        - name: Severity
          type: string
          jsonPath: .spec.severity
        - name: Status
          type: string
          jsonPath: .status.approvalState
        - name: Seen
          type: integer
          jsonPath: .spec.seenCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: patchrequests
    singular: patchrequest
    kind: PatchRequest
    shortNames: ["pr"]
