apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-controller
  namespace: monitoring
  labels:
    app: sre-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-controller
  strategy:
    type: Recreate          # Only 1 replica ever — prevents duplicate diagnoses
  template:
    metadata:
      labels:
        app: sre-controller
    spec:
      serviceAccountName: sre-observer-sa
      priorityClassName: sre-monitoring
      containers:
        - name: controller
          image: sre-controller:latest
          imagePullPolicy: Never    # Uses kind load docker-image — no registry needed
          env:
            - name: LLM_PROVIDER
              value: "auto"
            - name: VERTEX_PROJECT
              value: "sre-agent-project-505914"
            - name: VERTEX_LOCATION
              value: "us-central1"
            - name: VERTEX_MODEL
              value: "gemini-2.5-flash"
            - name: VERTEX_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sre-llm-secret
                  key: vertex-token
                  optional: true
            - name: OLLAMA_URL
              value: "http://ollama-service.ai-infra.svc.cluster.local:11434"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/etc/gcp/credentials.json"
            - name: OLLAMA_MODEL
              value: "deepseek-coder:6.7b-instruct"
            - name: OLLAMA_TIMEOUT
              value: "300"
            - name: WATCH_NAMESPACES
              value: "production,kube-system"
            - name: LOG_LEVEL
              value: "INFO"
            - name: OUTCOME_OBSERVATION_WINDOW
              value: "60"
            - name: PGHOST
              value: "postgres-svc.monitoring.svc.cluster.local"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database
            - name: RAG_SIMILARITY_THRESHOLD
              value: "0.75"
          resources:
            requests:
              cpu: "200m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          ports:
            - name: healthz
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: gcp-credentials
              mountPath: /etc/gcp
              readOnly: true
      volumes:
        - name: gcp-credentials
          secret:
            secretName: gcp-credentials

---
# ── SRE Controller Service (for Prometheus scraping) ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sre-controller
  namespace: monitoring
  labels:
    app: sre-controller
spec:
  selector:
    app: sre-controller
  ports:
    - name: healthz
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
