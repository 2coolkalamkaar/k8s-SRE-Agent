apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-ai-infra
  namespace: ai-infra
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic ONLY from the monitoring namespace (Kopf controller)
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - protocol: TCP
          port: 11434
  egress:
    # Air-gapped isolation: Block external internet access. Allow DNS resolution inside cluster only.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
