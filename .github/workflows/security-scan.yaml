name: 🛡️ DevSecOps Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ── Job 1: SAST (Static Application Security Testing - Bandit) ──────────────
  sast-scan:
    name:  SAST Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r controller/ -v --exit-zero -f custom --msg-template "{abspath}:{line}: {severity}: {test_id}: {msg}"

  # ── Job 2: SCA (Software Composition Analysis - Pip Audit) ───────────────────
  sca-scan:
    name:  SCA Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python Dependencies
        run: |
          pip-audit -r requirements.txt

  # ── Job 3: Trivy Security Scan & SARIF Upload to GitHub Security Tab ─────────
  trivy-scan:
    name: Trivy Security Scan & SARIF Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Generate SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy SARIF Report to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
