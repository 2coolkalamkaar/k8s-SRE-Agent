{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sre-agent.fullname" . }}-policy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sre-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sre-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow Prometheus to scrape metrics
    - ports:
        - port: {{ .Values.controller.metricsPort }}
          protocol: TCP
    # Allow health checks
    - ports:
        - port: {{ .Values.controller.healthPort }}
          protocol: TCP
{{- end }}
